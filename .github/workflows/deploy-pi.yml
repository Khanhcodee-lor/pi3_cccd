name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync project to Pi
        run: >-
          rsync -a --delete
          --exclude='.git/'
          --exclude='.venv/'
          --exclude='output/'
          "$GITHUB_WORKSPACE/"
          /home/khanh/p3_cccd/

      - name: Restart web server if installed
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          if [[ -f "$HOME/.config/systemd/user/cccd-web.service" ]]; then
            systemctl --user daemon-reload
            systemctl --user restart cccd-web.service
          else
            echo "User service cccd-web.service chưa được cài; bỏ qua restart."
          fi
